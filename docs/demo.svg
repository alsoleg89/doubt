<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Doubt before and after demo</title>
  <desc id="desc">A terminal-style comparison showing an agreeable answer scoring 22 and a calibrated answer scoring 100.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#09090b"/>
      <stop offset="0.55" stop-color="#15112a"/>
      <stop offset="1" stop-color="#071c24"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" x2="1">
      <stop stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1200" height="660" rx="26" fill="url(#bg)"/>
  <circle cx="1020" cy="100" r="140" fill="#22d3ee" opacity=".08" filter="url(#glow)"/>
  <circle cx="180" cy="570" r="170" fill="#8b5cf6" opacity=".09" filter="url(#glow)"/>
  <rect x="22" y="22" width="1156" height="616" rx="18" fill="none" stroke="#ffffff" stroke-opacity=".1"/>

  <circle cx="54" cy="54" r="6" fill="#fb7185"/>
  <circle cx="76" cy="54" r="6" fill="#fbbf24"/>
  <circle cx="98" cy="54" r="6" fill="#6ee7b7"/>
  <text x="600" y="60" fill="#71717a" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">doubt demo</text>

  <text x="64" y="126" fill="#fb7185" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700">WITHOUT DOUBT</text>
  <text x="64" y="164" fill="#e4e4e7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">
    <tspan x="64" dy="0">You're absolutely right! Microservices are definitely</tspan>
    <tspan x="64" dy="27">the best choice. They will always make the system</tspan>
    <tspan x="64" dy="27">more scalable. This is production-ready.</tspan>
  </text>
  <rect x="64" y="265" width="478" height="10" rx="5" fill="#27272a"/>
  <rect x="64" y="265" width="105" height="10" rx="5" fill="#fb7185"/>
  <text x="64" y="312" fill="#fb7185" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="34" font-weight="800">F  22/100</text>
  <text x="64" y="344" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">automatic agreement · absolutes · unsupported claim</text>

  <line x1="600" y1="112" x2="600" y2="574" stroke="#ffffff" stroke-opacity=".1"/>

  <text x="658" y="126" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700">WITH DOUBT</text>
  <text x="658" y="164" fill="#e4e4e7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">
    <tspan x="658" dy="0">The premise needs pressure-testing.</tspan>
    <tspan x="658" dy="34" fill="#a1a1aa">What holds</tspan>
    <tspan fill="#e4e4e7">  Independent deploys can help.</tspan>
    <tspan x="658" dy="28" fill="#a1a1aa">What may be wrong</tspan>
    <tspan x="658" dy="25" fill="#e4e4e7">No evidence shows coupling is the bottleneck.</tspan>
    <tspan x="658" dy="34" fill="#a1a1aa">Verdict</tspan>
    <tspan x="658" dy="25" fill="#e4e4e7">Start modular. Extract only with evidence.</tspan>
  </text>
  <rect x="658" y="392" width="478" height="10" rx="5" fill="#27272a"/>
  <rect x="658" y="392" width="478" height="10" rx="5" fill="url(#brand)"/>
  <text x="658" y="449" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="34" font-weight="800">A  100/100</text>
  <text x="658" y="481" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">assumption named · uncertainty bounded · action preserved</text>

  <rect x="64" y="554" width="1072" height="54" rx="12" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".08"/>
  <text x="92" y="588" fill="#71717a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">$</text>
  <text x="116" y="588" fill="#e4e4e7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">npx doubt-ai init --agent all</text>
  <text x="1106" y="588" fill="#22d3ee" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">zero dependencies</text>
</svg>
