<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
  <title id="title">Doubt — make AI evidence navigable</title>
  <desc id="desc">A source-grounded AI research map with a current position, supporting evidence, a contradiction, an unknown, and exact source regions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d0e"/>
      <stop offset="1" stop-color="#101314"/>
    </linearGradient>
    <linearGradient id="position" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a251a"/>
      <stop offset="1" stop-color="#111416"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".32"/>
    </filter>
  </defs>

  <rect width="1400" height="700" rx="24" fill="url(#bg)"/>
  <path d="M0 82H1400M1010 0V700" stroke="#252b28"/>

  <text x="52" y="52" fill="#eef0e7" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="800">Doubt</text>
  <text x="118" y="51" fill="#a8ec67" font-family="Arial,sans-serif" font-size="24" font-weight="800">↯</text>
  <text x="650" y="50" fill="#8e9690" font-family="ui-monospace,monospace" font-size="11" letter-spacing="2">EVIDENCE SNAPSHOT · SELF-CONTAINED HTML</text>

  <text x="52" y="132" fill="#a8ec67" font-family="ui-monospace,monospace" font-size="12" font-weight="700" letter-spacing="2">SOURCE-GROUNDED AI RESEARCH</text>
  <text x="52" y="190" fill="#eef0e7" font-family="Inter,Arial,sans-serif" font-size="48" font-weight="800" letter-spacing="-2">Make AI evidence</text>
  <text x="52" y="244" fill="#eef0e7" font-family="Inter,Arial,sans-serif" font-size="48" font-weight="800" letter-spacing="-2">navigable.</text>
  <path d="M640 166V246" stroke="#a8ec67" stroke-width="3"/>
  <text x="662" y="184" fill="#c8cec9" font-family="Inter,Arial,sans-serif" font-size="16">Inspect the argument—not just the answer.</text>
  <text x="662" y="211" fill="#8e9690" font-family="Inter,Arial,sans-serif" font-size="14">See support, contradiction, and unknowns;</text>
  <text x="662" y="234" fill="#8e9690" font-family="Inter,Arial,sans-serif" font-size="14">open every edge to its exact source region.</text>

  <g font-family="ui-monospace,monospace">
    <rect x="52" y="282" width="188" height="72" rx="12" fill="#111416" stroke="#252b28"/>
    <text x="72" y="315" fill="#eef0e7" font-size="24" font-weight="700">4</text>
    <text x="72" y="337" fill="#8e9690" font-size="10" letter-spacing="1.5">CLAIMS</text>
    <rect x="248" y="282" width="188" height="72" rx="12" fill="#111416" stroke="#252b28"/>
    <text x="268" y="315" fill="#eef0e7" font-size="24" font-weight="700">5</text>
    <text x="268" y="337" fill="#8e9690" font-size="10" letter-spacing="1.5">EVIDENCE</text>
    <rect x="444" y="282" width="188" height="72" rx="12" fill="#111416" stroke="#252b28"/>
    <text x="464" y="315" fill="#eef0e7" font-size="24" font-weight="700">2</text>
    <text x="464" y="337" fill="#8e9690" font-size="10" letter-spacing="1.5">TENSIONS</text>
    <rect x="640" y="282" width="188" height="72" rx="12" fill="#111416" stroke="#252b28"/>
    <text x="660" y="315" fill="#eef0e7" font-size="24" font-weight="700">1</text>
    <text x="660" y="337" fill="#8e9690" font-size="10" letter-spacing="1.5">UNKNOWN</text>
  </g>

  <path d="M299 494C330 520 355 533 392 560" fill="none" stroke="#a8ec67" stroke-width="2" opacity=".72"/>
  <path d="M500 494C468 521 446 535 412 560" fill="none" stroke="#ff806e" stroke-width="2" stroke-dasharray="7 6" opacity=".8"/>
  <path d="M701 494C640 531 559 548 432 575" fill="none" stroke="#eac96f" stroke-width="2" stroke-dasharray="2 7" opacity=".76"/>

  <g filter="url(#shadow)" font-family="Inter,Arial,sans-serif">
    <rect x="52" y="392" width="350" height="104" rx="14" fill="url(#position)" stroke="#3d493d"/>
    <text x="72" y="419" fill="#8e9690" font-family="ui-monospace,monospace" font-size="10" letter-spacing="1.5">POSITION</text>
    <text x="72" y="452" fill="#eef0e7" font-size="18" font-weight="700">Use Skills for reusable procedure.</text>
    <text x="72" y="478" fill="#8e9690" font-size="13">The verdict stays bounded by evidence.</text>

    <rect x="420" y="392" width="278" height="104" rx="14" fill="#111416" stroke="#ff806e"/>
    <text x="440" y="419" fill="#ff806e" font-family="ui-monospace,monospace" font-size="10" letter-spacing="1.5">CONTRADICTS</text>
    <text x="440" y="452" fill="#eef0e7" font-size="18" font-weight="700">MCP owns live tool access.</text>
    <text x="440" y="478" fill="#8e9690" font-size="13">Procedure alone cannot call a service.</text>

    <rect x="716" y="392" width="278" height="104" rx="14" fill="#111416" stroke="#eac96f" stroke-dasharray="5 5"/>
    <text x="736" y="419" fill="#eac96f" font-family="ui-monospace,monospace" font-size="10" letter-spacing="1.5">UNKNOWN</text>
    <text x="736" y="452" fill="#eef0e7" font-size="18" font-weight="700">Portability is still uneven.</text>
    <text x="736" y="478" fill="#8e9690" font-size="13">Client behavior can change the choice.</text>

    <rect x="225" y="560" width="410" height="132" rx="14" fill="#111416" stroke="#a8ec67"/>
    <text x="247" y="588" fill="#a8ec67" font-family="ui-monospace,monospace" font-size="10" letter-spacing="1.5">EVIDENCE · SUPPORTS</text>
    <text x="247" y="624" fill="#eef0e7" font-size="19" font-weight="700">Skills bundle instructions and references.</text>
    <text x="247" y="651" fill="#8e9690" font-size="13">Every evidence card opens a dated source region.</text>
    <text x="247" y="676" fill="#a8ec67" font-family="ui-monospace,monospace" font-size="11">↗ Agent Skills · Specification: directory structure</text>
  </g>

  <g font-family="ui-monospace,monospace">
    <text x="1040" y="48" fill="#8e9690" font-size="11" letter-spacing="1.7">REASONING EDGES</text>
    <path d="M1040 70H1350" stroke="#252b28"/>

    <text x="1040" y="110" fill="#8e9690" font-size="10">bundled-context</text>
    <rect x="1157" y="93" width="75" height="24" rx="5" fill="#a8ec67"/>
    <text x="1168" y="109" fill="#0b0d0e" font-size="10" font-weight="700">supports</text>
    <text x="1260" y="110" fill="#8e9690" font-size="10">position</text>
    <text x="1040" y="139" fill="#667069" font-size="10">The workflow travels with its references.</text>

    <path d="M1040 162H1350" stroke="#252b28"/>
    <text x="1040" y="196" fill="#8e9690" font-size="10">live-access</text>
    <rect x="1157" y="179" width="92" height="24" rx="5" fill="#ff806e"/>
    <text x="1166" y="195" fill="#0b0d0e" font-size="10" font-weight="700">contradicts</text>
    <text x="1270" y="196" fill="#8e9690" font-size="10">position</text>
    <text x="1040" y="225" fill="#667069" font-size="10">Dynamic tools require a protocol boundary.</text>

    <path d="M1040 248H1350" stroke="#252b28"/>
    <text x="1040" y="282" fill="#8e9690" font-size="10">portability</text>
    <rect x="1157" y="265" width="63" height="24" rx="5" fill="#eac96f"/>
    <text x="1166" y="281" fill="#0b0d0e" font-size="10" font-weight="700">missing</text>
    <text x="1260" y="282" fill="#8e9690" font-size="10">position</text>
    <text x="1040" y="311" fill="#667069" font-size="10">Equivalent client behavior is still unproven.</text>

    <text x="1040" y="380" fill="#8e9690" font-size="11" letter-spacing="1.7">EXACT SOURCE REGION</text>
    <path d="M1040 402H1350" stroke="#252b28"/>
    <text x="1040" y="442" fill="#8e9690" font-size="10">AGENT SKILLS · 2026-07-31</text>
    <text x="1040" y="476" fill="#eef0e7" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700">Agent Skills specification</text>
    <text x="1040" y="501" fill="#83b9ff" font-size="10">Directory structure</text>
    <text x="1040" y="538" fill="#aeb5b0" font-family="Inter,Arial,sans-serif" font-size="13">“A Skill contains SKILL.md and may</text>
    <text x="1040" y="559" fill="#aeb5b0" font-family="Inter,Arial,sans-serif" font-size="13">bundle scripts, references, and</text>
    <text x="1040" y="580" fill="#aeb5b0" font-family="Inter,Arial,sans-serif" font-size="13">assets.”</text>
    <text x="1040" y="620" fill="#a8ec67" font-size="11">OPEN SOURCE REGION ↗</text>

    <path d="M1040 650H1350" stroke="#252b28"/>
    <text x="1040" y="674" fill="#59615c" font-size="9">receipt · 621b1c851047…</text>
    <text x="1190" y="674" fill="#59615c" font-size="9">5 sources · 2 tensions · 1 unknown</text>
  </g>
</svg>
