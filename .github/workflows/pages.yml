name: Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Prepare self-contained demo
        run: |
          mkdir -p _site/examples _site/probes/launchkit _site/benchmark _site/playground _site/assets
          cp site/index.html _site/index.html
          cp docs/social-preview.png _site/social-preview.png
          cp site/playground/index.html _site/playground/index.html
          cp src/contract.js _site/assets/contract.js
          cp src/render-map.js _site/assets/render-map.js
          cp src/share-link.js _site/assets/share-link.js
          cp examples/agent-skills-vs-mcp.html _site/examples/agent-skills-vs-mcp.html
          cp examples/agent-skills-vs-mcp.doubt.json _site/examples/agent-skills-vs-mcp.doubt.json
          cp examples/what-should-doubt-become.html _site/examples/what-should-doubt-become.html
          cp examples/what-should-doubt-become.doubt.json _site/examples/what-should-doubt-become.doubt.json
          cp probes/launchkit/britanka.html _site/probes/launchkit/britanka.html
          node benchmarks/map-vs-memo/study.mjs --out _site/benchmark/index.html
          node scripts/build-skill-discovery.mjs _site
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          include-hidden-files: true
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
