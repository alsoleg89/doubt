name: Evidence contract
description: Propose a precise map invariant or source adapter
title: "[contract] "
labels: ["evidence-contract", "needs-evidence"]
body:
  - type: textarea
    id: failure
    attributes:
      label: Failure pattern
      description: What invalid or misleading map should Doubt reject?
    validations:
      required: true
  - type: textarea
    id: failing
    attributes:
      label: Minimal failing map
      description: Paste the smallest JSON fixture that demonstrates the problem.
    validations:
      required: true
  - type: textarea
    id: valid
    attributes:
      label: Valid map that must keep working
      description: Show the nearest legitimate case so the rule does not overreach.
    validations:
      required: true
