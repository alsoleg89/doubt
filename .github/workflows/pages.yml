name: Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Prepare self-contained demo
        run: |
          mkdir -p _site/examples _site/probes/launchkit
          cp site/index.html _site/index.html
          cp examples/what-should-doubt-become.html _site/examples/what-should-doubt-become.html
          cp examples/what-should-doubt-become.doubt.json _site/examples/what-should-doubt-become.doubt.json
          cp probes/launchkit/britanka.html _site/probes/launchkit/britanka.html
          node scripts/build-skill-discovery.mjs _site
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
