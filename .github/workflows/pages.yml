name: Pages

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/pages.yml"
      - "benchmarks/map-vs-memo/**"
      - "docs/social-preview.png"
      - "examples/**"
      - "scripts/build-skill-discovery.mjs"
      - "site/**"
      - "skill/**"
      - "src/contract.js"
      - "src/render-map.js"
      - "src/share-link.js"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Prepare self-contained demo
        run: |
          mkdir -p _site/examples _site/benchmark _site/playground _site/assets
          cp site/index.html _site/index.html
          cp site/robots.txt _site/robots.txt
          cp site/sitemap.xml _site/sitemap.xml
          cp site/llms.txt _site/llms.txt
          cp site/6cfa3cf24f13d6610627b17a367393d2.txt _site/6cfa3cf24f13d6610627b17a367393d2.txt
          cp docs/social-preview.png _site/social-preview.png
          cp site/playground/index.html _site/playground/index.html
          cp src/contract.js _site/assets/contract.js
          cp src/render-map.js _site/assets/render-map.js
          cp src/share-link.js _site/assets/share-link.js
          cp examples/agent-skills-portability.html _site/examples/agent-skills-portability.html
          cp examples/agent-skills-portability.doubt.json _site/examples/agent-skills-portability.doubt.json
          cp examples/agent-skills-vs-mcp.html _site/examples/agent-skills-vs-mcp.html
          cp examples/agent-skills-vs-mcp.doubt.json _site/examples/agent-skills-vs-mcp.doubt.json
          cp examples/what-should-doubt-become.html _site/examples/what-should-doubt-become.html
          cp examples/what-should-doubt-become.doubt.json _site/examples/what-should-doubt-become.doubt.json
          node benchmarks/map-vs-memo/study.mjs --out _site/benchmark/index.html
          node scripts/build-skill-discovery.mjs _site
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          include-hidden-files: true
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Notify IndexNow
        continue-on-error: true
        run: >-
          curl --fail-with-body --silent --show-error
          --request POST https://api.indexnow.org/indexnow
          --header "Content-Type: application/json; charset=utf-8"
          --data-binary @site/indexnow.json
